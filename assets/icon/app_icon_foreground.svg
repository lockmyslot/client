  <rect x="498" y="620" width="28" height="20" rx="5" fill="#4F46E5"/>
  <circle cx="512" cy="628" r="3" fill="#FFFFFF"/>
  <rect x="492" y="647" width="40" height="8" rx="4" fill="#4F46E5"/>

  <rect x="592" y="590" width="128" height="78" rx="20" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="626" cy="618" r="7" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="618" y="640" width="68" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- ROW 3 -->
  <rect x="304" y="686" width="128" height="78" rx="20" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="338" cy="714" r="7" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="330" y="736" width="70" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.5"/>

  <rect x="448" y="686" width="128" height="78" rx="20" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="482" cy="714" r="7" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="474" y="736" width="58" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.5"/>

  <rect x="592" y="686" width="128" height="78" rx="20" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="626" cy="714" r="7" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="618" y="736" width="52" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.5"/>
</svg>
