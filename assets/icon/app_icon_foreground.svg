<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Padlock Shackle: Vibrant Modern Indigo -->
    <linearGradient id="shackleIndigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Calendar Body Card: App Brand Indigo -->
    <linearGradient id="bodyIndigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <!-- Header Bar: Slightly brighter Indigo Accent -->
    <linearGradient id="headerIndigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Shackle Arch -->
  <path d="M 374 380 V 240 A 138 138 0 0 1 650 240 V 380"
        fill="none"
        stroke="url(#shackleIndigo)"
        stroke-width="70"
        stroke-linecap="round"/>

  <!-- Calendar Body Card -->
  <rect x="252" y="344" width="520" height="476" rx="96"
        fill="url(#bodyIndigo)"
        stroke="#4338CA"
        stroke-width="3"/>

  <!-- Top Glass Highlight Line -->
  <path d="M 348 346 H 676"
        stroke="#FFFFFF"
        stroke-opacity="0.35"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Calendar Header Bar -->
  <path d="M 252 444 V 444 A 96 96 0 0 1 348 344 H 676 A 96 96 0 0 1 772 444 V 456 H 252 Z"
        fill="url(#headerIndigo)"/>
  <line x1="252" y1="456" x2="772" y2="456" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Binder Clips -->
  <rect x="360" y="324" width="24" height="42" rx="12" fill="#FFFFFF" stroke="#4338CA" stroke-width="2.5"/>
  <rect x="640" y="324" width="24" height="42" rx="12" fill="#FFFFFF" stroke="#4338CA" stroke-width="2.5"/>

  <!-- Header Indicator -->
  <rect x="432" y="392" width="160" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- ================= TIME SLOTS / CALENDAR GRID ================= -->
  <!-- ROW 1 -->
  <rect x="304" y="494" width="128" height="78" rx="20" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="338" cy="522" r="7" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="330" y="544" width="76" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.5"/>

  <rect x="448" y="494" width="128" height="78" rx="20" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="482" cy="522" r="7" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="474" y="544" width="60" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.5"/>

  <rect x="592" y="494" width="128" height="78" rx="20" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="626" cy="522" r="7" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="618" y="544" width="72" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- ROW 2: The LOCKED ACTIVE SLOT in center -->
  <rect x="304" y="590" width="128" height="78" rx="20" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="338" cy="618" r="7" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="330" y="640" width="64" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.5"/>

