<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <mask id="padlockCutout">
      <!-- Retain slot background in white -->
      <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>
      <!-- Padlock silhouette in black (becomes transparent hole in mask) -->
      <!-- Padlock shackle -->
      <path d="M 504 620 V 615 A 8 8 0 0 1 520 615 V 620"
            fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
      <!-- Padlock body -->
      <rect x="496" y="620" width="32" height="22" rx="5" fill="#000000"/>
      <!-- Keyhole pin in white (filled silhouette) -->
      <circle cx="512" cy="629" r="3.5" fill="#FFFFFF"/>
      <!-- Bottom bar -->
      <rect x="490" y="647" width="44" height="8" rx="4" fill="#000000"/>
    </mask>
  </defs>

  <!-- Shackle Arch -->
  <path d="M 374 380 V 240 A 138 138 0 0 1 650 240 V 380"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="70"
        stroke-linecap="round"/>

  <!-- Calendar Body Card Outline -->
  <rect x="252" y="344" width="520" height="476" rx="96"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="28"/>

  <!-- Top Glass Highlight Line -->
  <line x1="348" y1="358" x2="676" y2="358"
        stroke="#FFFFFF"
        stroke-width="10"
        stroke-linecap="round"/>

  <!-- Calendar Header Bar Divider -->
  <line x1="252" y1="456" x2="772" y2="456"
        stroke="#FFFFFF"
        stroke-width="20"/>

  <!-- Binder Clips -->
  <rect x="360" y="324" width="24" height="42" rx="12" fill="#FFFFFF"/>
  <rect x="640" y="324" width="24" height="42" rx="12" fill="#FFFFFF"/>

  <!-- Header Indicator -->
  <rect x="432" y="392" width="160" height="18" rx="9" fill="#FFFFFF"/>

  <!-- ================= TIME SLOTS / CALENDAR GRID ================= -->
  <!-- ROW 1 -->
  <rect x="304" y="494" width="128" height="78" rx="20" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <rect x="448" y="494" width="128" height="78" rx="20" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <rect x="592" y="494" width="128" height="78" rx="20" fill="none" stroke="#FFFFFF" stroke-width="14"/>

  <!-- ROW 2 -->
  <rect x="304" y="590" width="128" height="78" rx="20" fill="none" stroke="#FFFFFF" stroke-width="14"/>

  <!-- CENTER ACTIVE LOCKED SLOT: Solid white with crisp padlock silhouette cutout -->
  <rect x="448" y="590" width="128" height="78" rx="20"
        fill="#FFFFFF"
        mask="url(#padlockCutout)"/>

  <rect x="592" y="590" width="128" height="78" rx="20" fill="none" stroke="#FFFFFF" stroke-width="14"/>

  <!-- ROW 3 -->
  <rect x="304" y="686" width="128" height="78" rx="20" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <rect x="448" y="686" width="128" height="78" rx="20" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <rect x="592" y="686" width="128" height="78" rx="20" fill="none" stroke="#FFFFFF" stroke-width="14"/>
</svg>